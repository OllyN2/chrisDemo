<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" preserveAspectRatio="none">
  <!-- Original top-down cabin: van facing up, raised central driver's seat at the front -->
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f88ad"/>
      <stop offset=".5" stop-color="#c9d6e8"/>
      <stop offset="1" stop-color="#6f88ad"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3e4"/>
      <stop offset="1" stop-color="#3d5f86"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4658"/>
      <stop offset="1" stop-color="#2a3342"/>
    </linearGradient>
  </defs>

  <!-- wheels peeking out -->
  <rect x="2" y="70" width="18" height="70" rx="6" fill="#1d2430"/>
  <rect x="280" y="70" width="18" height="70" rx="6" fill="#1d2430"/>
  <rect x="2" y="430" width="18" height="70" rx="6" fill="#1d2430"/>
  <rect x="280" y="430" width="18" height="70" rx="6" fill="#1d2430"/>

  <!-- body -->
  <path d="M60 6 Q150 -6 240 6 Q286 14 288 70 L290 520 Q290 552 258 554 L42 554 Q10 552 10 520 L12 70 Q14 14 60 6 Z"
        fill="url(#paint)" stroke="#2d4a73" stroke-width="4"/>

  <!-- windscreen -->
  <path d="M52 22 Q150 8 248 22 L262 74 Q150 62 38 74 Z" fill="url(#glass)" stroke="#2d4a73" stroke-width="3"/>

  <!-- floor / cabin tub -->
  <rect x="26" y="78" width="248" height="462" rx="22" fill="url(#floor)" stroke="#2d4a73" stroke-width="3"/>
  <!-- fibre-optic ceiling lights, seen as a dotted runner -->
  <g fill="#ffe9a8" opacity=".55">
    <circle cx="150" cy="200" r="2"/><circle cx="150" cy="240" r="2"/><circle cx="150" cy="280" r="2"/>
    <circle cx="150" cy="320" r="2"/><circle cx="150" cy="360" r="2"/><circle cx="150" cy="400" r="2"/>
    <circle cx="150" cy="440" r="2"/><circle cx="150" cy="480" r="2"/><circle cx="150" cy="520" r="2"/>
  </g>

  <!-- dashboard -->
  <path d="M40 80 Q150 70 260 80 L258 100 Q150 92 42 100 Z" fill="#1d2430"/>

  <!-- raised central driver's seat with steering wheel -->
  <rect x="112" y="98" width="76" height="62" rx="16" fill="#2d4a73" stroke="#1d2430" stroke-width="2"/>
  <rect x="120" y="104" width="60" height="44" rx="12" fill="#e9dcc3"/>
  <rect x="120" y="146" width="60" height="12" rx="6" fill="#cdbb98"/>
  <circle cx="150" cy="104" r="15" fill="none" stroke="#1d2430" stroke-width="5"/>
  <path d="M135 104 H165" stroke="#1d2430" stroke-width="4"/>
</svg>
