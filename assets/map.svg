  </g>
  <g stroke="#b9a37a" stroke-opacity=".22" stroke-width="1">
    <path d="M450 150 L0 600 M450 150 L600 0 M450 150 L0 150 M450 150 L600 300 M450 150 L150 600 M450 150 L600 450 M450 150 L300 0"/>
  </g>
  <g transform="translate(450 150)" opacity=".28">
